#:schema https://mise.jdx.dev/schema/mise-task.json

["validate:all"]
alias = "validate"
description = "Run all pre-commit hooks"
run = "pre-commit run --config .config/pre-commit.yaml --all-files"

["validate:pytest"]
alias = "pytest"
description = "Run Python tests"
dir = "{{ env.PYTHONPATH }}"
run = "pytest"

["validate:ruff"]
alias = "ruff"
description = "Run ruff check"
dir = "{{ env.PYTHONPATH }}"
run = "ruff check"

["validate:compose"]
description = "Validate all compose files for Swarm compatibility"
run = "python3 -m swarm.validate"

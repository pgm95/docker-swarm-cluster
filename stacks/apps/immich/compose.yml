# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

include:
  - secrets.yml
  - configs.yml

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    entrypoint: ["/bin/sh", "/init.sh"]
    logging:
      <<: *logging
    stop_grace_period: 30s
    environment:
      - IMMICH_OWNER=${GLOBAL_NONROOT_DOCKER}
      - REDIS_HOSTNAME=valkey
      - DB_HOSTNAME=database
      - DB_USERNAME=postgres
      - DB_DATABASE_NAME=immich
      - DB_PASSWORD_FILE=/run/secrets/db_password
      # - IMMICH_IGNORE_MOUNT_CHECK_ERRORS=true
      # - CREDENTIALS_DIRECTORY=/run/secrets
    secrets:
      - db_password
    configs:
      - source: immich_server_init
        target: /init.sh
    networks:
      - default
      - infra_gw-internal
    # Originals on the bulk share at /data; cache subdirs overlay as subpath mounts of
    # server-data to keep generated content off the share. Subpaths need precreation.
    volumes:
      - /dev/dri:/dev/dri # Hardware Transcoding
      - /etc/localtime:/etc/localtime:ro
      - type: volume
        source: cifs-photos
        target: /data
        volume:
          subpath: immich
      - type: volume
        source: cifs-photos
        target: /external/archive
        volume:
          subpath: archive
      - type: volume
        source: cifs-photos
        target: /external/wedding
        volume:
          subpath: wedding
      - type: volume
        source: server-data
        target: /data/thumbs
        volume:
          subpath: thumbs
      - type: volume
        source: server-data
        target: /data/encoded-video
        volume:
          subpath: encoded-video
      - type: volume
        source: server-data
        target: /data/profile
        volume:
          subpath: profile
      - type: volume
        source: server-data
        target: /data/backups
        volume:
          subpath: backups
    healthcheck:
      disable: false
      start_period: 120s
      interval: 30s
    deploy:
      <<: [*place-gpu, *deploy]
      update_config:
        order: stop-first
      labels:
        - "traefik.enable=true"
        - "traefik.scope.internal=true"
        - "traefik.http.routers.immich.rule=Host(`immich.${DOMAIN_PRIVATE}`)"
        - "traefik.http.routers.immich.entrypoints=websecure"
        - "traefik.http.services.immich.loadbalancer.server.port=2283"
        - "homepage.group=Media"
        - "homepage.name=Immich"
        - "homepage.icon=immich"
        - "homepage.href=https://immich.${DOMAIN_PRIVATE}"
        - "homepage.widget.type=immich"
        - "homepage.widget.version=2"
        - "homepage.widget.url=https://immich.${DOMAIN_PRIVATE}"
        - "homepage.widget.key={{HOMEPAGE_VAR_IMMICH_KEY}}"
        - 'homepage.widget.fields=["photos", "videos", "storage"]'
      mode: replicated
      replicas: 1
      resources:
        limits:
          memory: 4096M
        reservations:
          memory: 1024M

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release-openvino
    logging:
      <<: *logging
    stop_grace_period: 30s
    environment:
      - MACHINE_LEARNING_REQUEST_THREADS=8 # Set to node CPU cores or less
      # - MACHINE_LEARNING_OPENVINO_PRECISION=FP16  # half-precision, faster on Battlemage with negligible accuracy loss
    volumes:
      - /dev/dri:/dev/dri # Machine Learning
      - ml-cache:/cache
    healthcheck:
      disable: false
    deploy:
      <<: [*place-gpu, *deploy]
      update_config:
        order: start-first
      mode: replicated
      replicas: 1
      resources:
        limits:
          memory: 4096M
        reservations:
          memory: 1024M

  valkey:
    image: docker.io/valkey/valkey:9@sha256:3b55fbaa0cd93cf0d9d961f405e4dfcc70efe325e2d84da207a0a8e6d8fde4f9
    logging:
      <<: *logging
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      <<: [*place-gpu, *deploy]
      update_config:
        order: stop-first
      mode: replicated
      replicas: 1
      resources:
        <<: *resources-medium

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    logging:
      <<: *logging
    stop_grace_period: 60s
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_USER=postgres
      - POSTGRES_DB=immich
      - POSTGRES_INITDB_ARGS=--data-checksums
    secrets:
      - db_password
    tmpfs:
      - /dev/shm:size=134217728
    volumes:
      - database-data:/var/lib/postgresql/data
    networks:
      - default
      - infra_backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d immich -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      <<: [*place-gpu, *deploy]
      update_config:
        order: stop-first
      mode: replicated
      replicas: 1
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M

  init-backup:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    entrypoint: ["/bin/sh", "/init-backup-entrypoint.sh"]
    logging:
      <<: *logging
    stop_grace_period: 30s
    secrets:
      - db_password
      - immich_backup_db_password
    configs:
      - source: init_backup_entrypoint
        target: /init-backup-entrypoint.sh
    healthcheck:
      test: ["NONE"]
    deploy:
      <<: [*place-gpu, *deploy-init]
      mode: replicated
      replicas: 1
      resources:
        <<: *resources-tiny

volumes:
  ml-cache:
  database-data:
  server-data:
  cifs-photos:
    driver: local
    driver_opts:
      type: cifs
      device: //${GLOBAL_CIFS_HOST}/photos
      o: "username=${GLOBAL_CIFS_USERNAME},password=${GLOBAL_CIFS_PASSWORD},uid=${GLOBAL_NONROOT_PUID},gid=${GLOBAL_NONROOT_PGID},iocharset=utf8"

networks:
  infra_gw-internal:
    external: true
  infra_backup:
    external: true

# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

include:
  - include.yml

services:
  postgres:
    image: postgres:17.11-trixie
    logging:
      <<: *logging
    stop_grace_period: 60s
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_superuser_password
      - GLOBAL_DB_PROVISIONER_USER=${GLOBAL_DB_PROVISIONER_USER}
    secrets:
      - postgres_superuser_password
      - global_db_provisioner_password
    configs:
      - source: postgres_init
        target: /docker-entrypoint-initdb.d/init.sh
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 134217728
    networks:
      - infra_postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      <<: [*place-main, *deploy]
      update_config:
        order: stop-first
      mode: replicated
      replicas: 1
      resources:
        <<: *resources-huge

volumes:
  postgres-data:

networks:
  infra_postgres:
    external: true

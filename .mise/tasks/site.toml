#:schema https://mise.jdx.dev/schema/mise-task.json

["site:deploy-infra"]
alias = "infra"
description = "Deploy all infra stacks in NN_ order"
depends = ["swarm:init-networks"]
run = '''
{% raw %}
#!/usr/bin/env bash
failed=()
for d in stacks/infra/*/; do
    python3 -m swarm.deploy "$d" || failed+=("$(basename "$d")")
done
[[ ${#failed[@]} -eq 0 ]] || { echo "Failed: ${failed[*]}" >&2; exit 1; }
{% endraw %}
'''

["site:deploy-apps"]
alias = "apps"
description = "Deploy all app stacks (sequential, continues on failure)"
run = '''
{% raw %}
#!/usr/bin/env bash
failed=()
for d in stacks/apps/*/; do
    [[ -f "$d/.nodeploy" ]] && continue
    python3 -m swarm.deploy "$d" || failed+=("$(basename "$d")")
done
[[ ${#failed[@]} -eq 0 ]] || { echo "Failed: ${failed[*]}" >&2; exit 1; }
{% endraw %}
'''

["site:drain"]
description = "Remove all stacks in reverse order"
confirm = "This will bring down ALL running stacks. Continue?"
run = '''
{% raw %}
#!/usr/bin/env bash
echo "--- Removing app stacks ---" >&2
for d in $(ls -dr stacks/apps/*/ 2>/dev/null); do
    python3 -m swarm.remove "$d" || true
done
echo "--- Removing infra stacks ---" >&2
for d in $(ls -dr stacks/infra/*/ 2>/dev/null); do
    python3 -m swarm.remove "$d" || true
done
{% endraw %}
'''

["site:registry"]
description = "Login all swarm nodes to the private registry"
raw_args = true
run = "python3 -m swarm.registry_auth"

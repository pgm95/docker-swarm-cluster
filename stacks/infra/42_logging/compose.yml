# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

include:
  - include.yml

services:
  loki:
    image: grafana/loki:3.6.7
    logging:
      <<: *logging
    stop_grace_period: 60s
    command:
      - "-config.file=/etc/loki/loki.yml"
    configs:
      - source: loki_config
        target: /etc/loki/loki.yml
    networks:
      - infra_metrics
      - infra_gw-internal
    volumes:
      - loki-data:/loki
    # distroless image with no shell or wget; use the binary's built-in health probe
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      <<: [*place-main, *deploy]
      labels:
        - "traefik.enable=true"
        - "traefik.scope.internal=true"
        - "traefik.http.routers.loki.rule=Host(`loki.${DOMAIN_PRIVATE}`)"
        - "traefik.http.routers.loki.entrypoints=websecure"
        - "traefik.http.services.loki.loadbalancer.server.port=3100"
      update_config:
        order: stop-first
      mode: replicated
      replicas: 1
      resources:
        <<: *resources-large

  alloy:
    image: grafana/alloy:v1.14.0
    command:
      - "run"
      - "/etc/alloy/config.alloy"
      - "--storage.path=/tmp/alloy"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--disable-reporting"
    # Swarm gives each task its own UTS namespace, so a container's HOSTNAME is its container ID.
    # Tagging Alloy's `node` external_label with that would churn the label on every restart, so we
    # inject the real node hostname via the Swarm template; it resolves at schedule time and matches
    # the `instance` label Prometheus SD sets for cadvisor and node-exporter.
    environment:
      NODE_HOSTNAME: "{{.Node.Hostname}}"
    logging:
      <<: *logging
    stop_grace_period: 30s
    configs:
      - source: alloy_config
        target: /etc/alloy/config.alloy
    networks:
      - infra_metrics
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # alloy image has bash but no wget/curl; probe the HTTP port via bash's /dev/tcp
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/12345' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      <<: *deploy
      update_config:
        order: start-first
      mode: global
      resources:
        <<: *resources-medium

volumes:
  loki-data:

networks:
  infra_metrics:
    external: true
  infra_gw-internal:
    external: true

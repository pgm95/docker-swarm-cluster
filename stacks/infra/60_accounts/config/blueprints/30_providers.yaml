      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: !Env OIDC_DAWARICH_CLIENT_ID
      client_secret: !File /run/secrets/oidc_dawarich_client_secret
      redirect_uris:
        - url: !Format ["https://maps.%s/users/auth/openid_connect/callback", !Env DOMAIN_PRIVATE]
          matching_mode: strict
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: user_username
      grant_types: [authorization_code, refresh_token]
      access_token_validity: hours=1
      refresh_token_validity: days=30
  - model: authentik_core.application
    id: app-dawarich
    state: present
    identifiers:
      slug: dawarich
    attrs:
      name: Dawarich
      provider: !KeyOf provider-dawarich
      meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/dawarich.svg
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      order: 0
      target: !KeyOf app-dawarich
    attrs:
      group: !Find [authentik_core.group, [name, !Env GLOBAL_ADMIN_GROUP]]
      enabled: true

  # ===== FileBrowser Quantum =====
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-quantum
    state: present
    identifiers:
      name: FileBrowser Quantum
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: !Env OIDC_QUANTUM_CLIENT_ID
      client_secret: !File /run/secrets/oidc_quantum_client_secret
      redirect_uris:
        - url: !Format ["https://files.%s/api/auth/oidc/callback", !Env DOMAIN_PRIVATE]
          matching_mode: strict
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: user_username
      grant_types: [authorization_code, refresh_token]
      access_token_validity: hours=1
      refresh_token_validity: days=30
  - model: authentik_core.application
    id: app-quantum
    state: present
    identifiers:
      slug: quantum
    attrs:
      name: FileBrowser Quantum
      provider: !KeyOf provider-quantum
      meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/filebrowser-quantum.svg
      # Starts the OIDC login directly instead of Quantum's login page.
      meta_launch_url: !Format ["https://files.%s/api/auth/oidc/login?redirect=/files/", !Env DOMAIN_PRIVATE]
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      order: 0
      target: !KeyOf app-quantum
    attrs:
      group: !Find [authentik_core.group, [name, !Env GLOBAL_ADMIN_GROUP]]
      enabled: true

  # ===== Stirling PDF =====
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-stirling
    state: present
    identifiers:
      name: Stirling PDF
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: !Env OIDC_STIRLING_CLIENT_ID
      client_secret: !File /run/secrets/oidc_stirling_client_secret
      redirect_uris:
        # The last path segment is Stirling's SECURITY_OAUTH2_PROVIDER
        - url: !Format ["https://pdf.%s/login/oauth2/code/authentik", !Env DOMAIN_PRIVATE]
          matching_mode: strict
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: user_username
      grant_types: [authorization_code, refresh_token]
      access_token_validity: hours=1
      refresh_token_validity: days=30
  - model: authentik_core.application
    id: app-stirling
    state: present
    identifiers:
      slug: stirling
    attrs:
      name: Stirling PDF
      provider: !KeyOf provider-stirling
      meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/stirling-pdf.svg
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      order: 0
      target: !KeyOf app-stirling
    attrs:
      group: !Find [authentik_core.group, [name, !Env GLOBAL_USER_GROUP]]
      enabled: true

  # ===== Immich =====
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-immich
    state: present
    identifiers:
      name: Immich
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: immich
      client_secret: !File /run/secrets/oidc_immich_client_secret
      redirect_uris:
        - url: !Format ["https://immich.%s/auth/login", !Env DOMAIN_PRIVATE]
          matching_mode: strict
        - url: !Format ["https://immich.%s/user-settings", !Env DOMAIN_PRIVATE]
          matching_mode: strict
        - url: "app.immich:///oauth-callback"
          matching_mode: strict
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: user_username
      grant_types: [authorization_code, refresh_token]
      access_token_validity: hours=1
      refresh_token_validity: days=30
  - model: authentik_core.application
    id: app-immich
    state: present
    identifiers:
      slug: immich
    attrs:
      name: Immich
      provider: !KeyOf provider-immich
      meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/immich.svg
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      order: 0
      target: !KeyOf app-immich
    attrs:
      group: !Find [authentik_core.group, [name, !Env GLOBAL_ADMIN_GROUP]]

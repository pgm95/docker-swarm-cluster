#:schema https://mise.jdx.dev/schema/mise-task.json

# Targets: a global stem (shared, dev, prod) or a stack name. Resolution and
# file discovery live in `python3 -m swarm.secrets path`.

["sops:init"]
description = "Generate the age identity and print the recipient for SOPS_CONFIG"
run = '''
#!/usr/bin/env bash
if [[ -f "${SOPS_AGE_KEY_FILE}" ]]; then
    echo "Age key exists: ${SOPS_AGE_KEY_FILE}" >&2
else
    mkdir -p "$(dirname "${SOPS_AGE_KEY_FILE}")"
    age-keygen -o "${SOPS_AGE_KEY_FILE}"
    chmod 600 "${SOPS_AGE_KEY_FILE}"
    echo "Age key created: ${SOPS_AGE_KEY_FILE}" >&2
fi
pubkey=$(age-keygen -y "${SOPS_AGE_KEY_FILE}")
[[ -n "${pubkey}" ]] || { echo "Error: failed to derive the public key from ${SOPS_AGE_KEY_FILE}" >&2; exit 1; }
if grep -q "${pubkey}" "${SOPS_CONFIG}" 2>/dev/null; then
    echo "Recipient already present in ${SOPS_CONFIG}" >&2
else
    echo "Add this recipient under keys: in ${SOPS_CONFIG}, then run sops updatekeys on every file:" >&2
    echo "  - &operator ${pubkey}" >&2
fi
'''

["sops:edit"]
description = "Edit a SOPS file by target (creates it when missing)"
usage = '''
arg "<target>" help="Global stem (shared, dev, prod) or stack name"
complete "target" run="python3 -m swarm.secrets path --targets"
'''
env.SOPS_EDITOR = "{{ get_env(name='SOPS_EDITOR', default='code --wait') }}"
run = '''
#!/usr/bin/env bash
file=$(python3 -m swarm.secrets path "${usage_target}") || exit 1
sops edit "${file}"
rc=$?
# sops exits 200 when the editor makes no changes; not a failure
[[ ${rc} -eq 200 ]] && exit 0
exit "${rc}"
'''

["sops:encrypt"]
description = "Encrypt in place any *.sops.yaml that is still plaintext"
run = '''
{% raw %}
#!/usr/bin/env bash
[[ -f "${SOPS_AGE_KEY_FILE}" ]] || { echo "Error: no age key. Run: mise run sops:init" >&2; exit 1; }
encrypted=() skipped=()
while IFS= read -r file; do
    if [[ "$(sops filestatus "${file}")" == *'"encrypted":true'* ]]; then
        skipped+=("${file}")
    elif sops encrypt -i "${file}"; then
        encrypted+=("${file}")
    else
        echo "Failed to encrypt: ${file}" >&2
        exit 1
    fi
done < <(python3 -m swarm.secrets path --all)
if [[ ${#encrypted[@]} -gt 0 ]]; then
    echo "Encrypted:" >&2
    printf '  %s\n' "${encrypted[@]}" >&2
fi
if [[ ${#skipped[@]} -gt 0 ]]; then
    echo "Already encrypted:" >&2
    printf '  %s\n' "${skipped[@]}" >&2
fi
[[ ${#encrypted[@]} -eq 0 && ${#skipped[@]} -eq 0 ]] && echo "No *.sops.yaml files found" >&2
exit 0
{% endraw %}
'''

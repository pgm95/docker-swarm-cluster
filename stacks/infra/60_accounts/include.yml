secrets:
  # Core Authentik (versioned)
  authentik_secret_key:
    name: authentik_secret_key_${DEPLOY_VERSION}
    external: true
  authentik_postgres_password:
    name: authentik_postgres_password_${DEPLOY_VERSION}
    external: true

  # lldap server (versioned)
  lldap_jwt_secret:
    name: lldap_jwt_secret_${DEPLOY_VERSION}
    external: true
  lldap_key_seed:
    name: lldap_key_seed_${DEPLOY_VERSION}
    external: true

  # Service account passwords seeded by init-ldap, consumed by Authentik LDAP source / Jellyfin LDAP plugin
  authentik_bind_pass:
    name: authentik_bind_pass_${DEPLOY_VERSION}
    external: true
  jellyfin_bind_pass:
    name: jellyfin_bind_pass_${DEPLOY_VERSION}
    external: true
  test_user_pass:
    name: test_user_pass_${DEPLOY_VERSION}
    external: true

  # Shared (versioned, remapped from GLOBAL_SECRETS)
  smtp_pass:
    name: global_smtp_pass_${DEPLOY_VERSION}
    external: true
  global_password:
    name: global_password_${DEPLOY_VERSION}
    external: true

  # OIDC client secrets (versioned)
  oidc_client_secret_mealie:
    name: oidc_client_secret_mealie_${DEPLOY_VERSION}
    external: true
  oidc_client_secret_dawarich:
    name: oidc_client_secret_dawarich_${DEPLOY_VERSION}
    external: true
  oidc_client_secret_quantum:
    name: oidc_client_secret_quantum_${DEPLOY_VERSION}
    external: true
  oidc_client_secret_immich:
    name: oidc_client_secret_immich_${DEPLOY_VERSION}
    external: true
  oidc_client_secret_grafana:
    name: oidc_client_secret_grafana_${DEPLOY_VERSION}
    external: true
  oidc_client_secret_tailscale:
    name: oidc_client_secret_tailscale_${DEPLOY_VERSION}
    external: true

configs:
  blueprint_directory:
    name: blueprint_directory_${DEPLOY_VERSION}
    file: ./config/blueprints/10_directory.yaml
  blueprint_scope_mappings:
    name: blueprint_scope_mappings_${DEPLOY_VERSION}
    file: ./config/blueprints/20_scope-mappings.yaml
  blueprint_ldap_source:
    name: blueprint_ldap_source_${DEPLOY_VERSION}
    file: ./config/blueprints/25_ldap-source.yaml
  blueprint_providers:
    name: blueprint_providers_${DEPLOY_VERSION}
    file: ./config/blueprints/30_providers.yaml
  blueprint_brand:
    name: blueprint_brand_${DEPLOY_VERSION}
    file: ./config/blueprints/50_brand.yaml
  lldap_config:
    name: lldap_config_${DEPLOY_VERSION}
    file: ./config/lldap/lldap_config.toml
  init_db_entrypoint:
    name: init_db_accounts_entrypoint_${DEPLOY_VERSION}
    file: ./config/bootstrap/init-db.sh
  init_ldap_entrypoint:
    name: init_ldap_entrypoint_${DEPLOY_VERSION}
    file: ./config/bootstrap/init-ldap.sh

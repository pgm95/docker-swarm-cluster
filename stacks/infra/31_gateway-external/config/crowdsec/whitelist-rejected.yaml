# Discards events for requests that Traefik's own middlewares rejected, so gateway 403s cannot feed ban scenarios (http-probing counts 403s on distinct paths; a deploy-window 403 burst once banned legit clients, and banned clients retrying would keep renewing their own ban).
#
# Discriminator: ServiceAddr/ServiceURL are written by a single FieldHandler wrapping the selected backend proxy, below the middleware chain (pkg/server/service/service.go).
# Middleware rejections short-circuit above it, so the field is never set.
#
# JSON access logs omit unset fields, and the hub traefik parser maps ServiceAddr to Parsed.service_addr only when present, so an absent/empty service_addr holds iff no backend was selected.
# CLF access logs render the same absence as a literal "-" in traefik_server_url
# Both clauses are kept for portability.
#
# Backend-emitted 403s carry a backend address and still count, as do 400/404/503.

name: 01-gateway-rejections
description: "Requests already rejected by the gateway's own middlewares"
filter: "evt.Meta.log_type == 'http_access-log'"
whitelist:
  reason: "Rejected before reaching a backend; not evidence of probing"
  expression:
    - >-
      evt.Meta.http_status == '403' &&
      (evt.Parsed.service_addr in [nil, ''] || evt.Parsed.traefik_server_url == '-')

# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: OIDC Providers
  labels:
    blueprints.goauthentik.io/instantiate: "true"

# Every provider sends the lldap username as sub: it survives a purge of the Authentik database.
# grant_types is required since 2026.8: a provider created without it allows no grant at all.

entries:

  # ===== Mealie =====
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-mealie
    state: present
    identifiers:
      name: Mealie
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: !Env OIDC_MEALIE_CLIENT_ID
      client_secret: !File /run/secrets/oidc_mealie_client_secret
      redirect_uris:
        - url: !Format ["https://recipes.%s/login", !Env DOMAIN_PUBLIC]
          matching_mode: strict
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, custom/scope-mealie-profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: user_username
      grant_types: [authorization_code, refresh_token]
      access_token_validity: hours=1
      refresh_token_validity: days=30
  - model: authentik_core.application
    id: app-mealie
    state: present
    identifiers:
      slug: mealie
    attrs:
      name: Mealie
      provider: !KeyOf provider-mealie
      meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/mealie.svg
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      order: 0
      target: !KeyOf app-mealie
    attrs:
      group: !Find [authentik_core.group, [name, !Env GLOBAL_USER_GROUP]]
      enabled: true

  # ===== Dawarich =====
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-dawarich
    state: present
    identifiers:
      name: Dawarich

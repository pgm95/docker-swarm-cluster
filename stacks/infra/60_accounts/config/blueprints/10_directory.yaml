# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: Directory Bootstrap
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  # Admins come from lldap: members of lldap_admin are superusers through the group
  # mapping in 25_ldap-source.yaml. The default bootstrap admin is kept disabled.
  # name is required when this entry runs before the system bootstrap creates the user
  - model: authentik_core.user
    state: present
    identifiers:
      username: akadmin
    attrs:
      name: authentik Default Admin
      is_active: false

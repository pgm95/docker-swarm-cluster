  gateway_external_crowdsec_cti_key:
    name: gateway_external_crowdsec_cti_key_${DEPLOY_VERSION}
    external: true
  widget_crowdsec_password:
    name: widget_crowdsec_password_${DEPLOY_VERSION}
    external: true
  global_db_provisioner_password:
    name: global_db_provisioner_password_${DEPLOY_VERSION}
    external: true
  gateway_external_crowdsec_db_password:
    name: gateway_external_crowdsec_db_password_${DEPLOY_VERSION}
    external: true
  global_cloudflare_acme_public_token:
    name: global_cloudflare_acme_public_token_${DEPLOY_VERSION}
    external: true

configs:
  gateway_external_traefik_dynamic_base:
    name: gateway_external_traefik_dynamic_base_${DEPLOY_VERSION}

# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

include:
  - include.yml

services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.8
    entrypoint: ["/bin/sh", "/init.sh"]
    logging:
      <<: *logging
    stop_grace_period: 30s
    environment:
      - JELLYFIN_OWNER=${GLOBAL_NONROOT_DOCKER}
      - JELLYFIN_CONFIG_DIR=/etc/jellyfin
      - JELLYFIN_LOG_DIR=/var/log/jellyfin
      - JELLYFIN_DATA_DIR=/var/lib/jellyfin
      - JELLYFIN_CACHE_DIR=/var/cache/jellyfin
    networks:
      - infra_gw-external
      - infra_gw-internal
      - infra_ldap
    volumes:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card0:/dev/dri/card0
      - cifs-media:/media
      - jellyfin-config:/etc/jellyfin
      - jellyfin-data:/var/lib/jellyfin
      - jellyfin-logs:/var/log/jellyfin
      - jellyfin-cache:/var/cache/jellyfin
    configs:
      - source: jellyfin_init
        target: /init.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      <<: [*place-gpu, *deploy]
      update_config:
        order: stop-first
      labels:
        - "traefik.enable=true"
        - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
        - "traefik.scope.external=true"
        - "traefik.http.routers.jellyfin-external.rule=Host(`stream.${DOMAIN_PUBLIC}`)"
        - "traefik.http.routers.jellyfin-external.entrypoints=websecure"
        - "traefik.http.routers.jellyfin-external.service=jellyfin"
        - "traefik.scope.internal=true"
        - "traefik.http.routers.jellyfin-internal.rule=Host(`jellyfin.${DOMAIN_PRIVATE}`)"
        - "traefik.http.routers.jellyfin-internal.entrypoints=websecure"
        - "traefik.http.routers.jellyfin-internal.service=jellyfin"
        - "homepage.group=Media"
        - "homepage.name=Jellyfin"
        - "homepage.icon=jellyfin"
        - "homepage.href=https://jellyfin.${DOMAIN_PRIVATE}"
        - "homepage.widget.type=jellyfin"
        - "homepage.widget.version=2"
        - "homepage.widget.url=https://jellyfin.${DOMAIN_PRIVATE}"
        - "homepage.widget.key={{HOMEPAGE_VAR_JELLYFIN_KEY}}"
        - "homepage.widget.enableNowPlaying=false"
        - "homepage.widget.enableBlocks=true"
        - 'homepage.widget.fields=["movies", "series", "episodes"]'
      mode: replicated
      replicas: 1
      resources:
        limits:
          memory: 4096M
        reservations:
          memory: 1024M

  jellyfin-cleanup:
    image: alpine/sqlite:3.51.2
    entrypoint: ["/bin/sh", "/cleanup.sh"]
    user: "1000:1000"
    logging:
      <<: *logging
    stop_grace_period: 10s
    environment:
      - CLEANUP_USERNAME=_test_user
      - CLEANUP_INTERVAL=3600
    volumes:
      - jellyfin-data:/data
    configs:
      - source: jellyfin_cleanup
        target: /cleanup.sh
    deploy:
      <<: [*place-gpu, *deploy]
      update_config:
        order: start-first
      resources:
        <<: *resources-tiny

volumes:
  jellyfin-config:
  jellyfin-data:
  jellyfin-logs:
  jellyfin-cache:
  cifs-media:
    driver: local
    driver_opts:
      type: cifs
      device: //${GLOBAL_CIFS_HOST}/media
      o: "username=${GLOBAL_CIFS_USERNAME},password=${GLOBAL_CIFS_PASSWORD},uid=${GLOBAL_NONROOT_PUID},gid=${GLOBAL_NONROOT_PGID},iocharset=utf8"

networks:
  infra_gw-external:
    external: true
  infra_gw-internal:
    external: true
  infra_ldap:
    external: true

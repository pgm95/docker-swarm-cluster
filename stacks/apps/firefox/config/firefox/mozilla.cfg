// Autoconfig, loaded through autoconfig.js; Firefox skips this first line.
// Covers what enterprise policies cannot: there is no policy or pref that
// disables toolbar customization, the new tab page's customize panel, or access
// to about pages, local files and local addresses (WebsiteFilter match patterns
// cannot express address ranges).
(() => {
  // Hidden UI: toolbar customize entries, the app menu (☰), the tab list
  // button, the sidebar and the address bar's search engine selector in the
  // browser window, and the customize (pencil) button on the new tab page. A user sheet: Firefox 156 ignores @-moz-document blocks in agent
  // sheets, and without them the rules would also hit ordinary web pages.
  const css = `
    @-moz-document url-prefix("chrome://browser/content/browser.xhtml") {
      #toolbar-context-customize,
      .viewCustomizeToolbar,
      #appmenu-customizetoolbar,
      #overflowMenu-customize-button,
      #menu_customizeToolbars,
      #PanelUI-menu-button,
      #alltabs-button,
      #toolbar-menubar,
      #sidebar-button,
      #sidebar-container,
      #sidebar-box,
      #sidebar-splitter,
      #sidebar-launcher-splitter,
      .searchmode-switcher {
        display: none !important;
      }
    }
    @-moz-document url-prefix("about:newtab"), url-prefix("about:home") {
      .personalizeButtonWrapper {
        display: none !important;
      }
    }
  `;
  const sss = Components.classes["@mozilla.org/content/style-sheet-service;1"]
    .getService(Components.interfaces.nsIStyleSheetService);
  const uri = Services.io.newURI("data:text/css;charset=utf-8," + encodeURIComponent(css));
  if (!sss.sheetRegistered(uri, sss.USER_SHEET)) {
    sss.loadAndRegisterSheet(uri, sss.USER_SHEET);
  }

  // Address bar actions (print, save as PDF, restart, clear history, settings
  // and more) have no off switch: the suggest pref (policies) only covers
  // ordinary typing, while the ">" search mode lists them regardless. Both
  // paths ask this provider for the matching actions, so it returns none.
  let actionsOff = false;
  function disableUrlbarActions() {
    if (actionsOff) {
      return;
    }
    const { ActionsProviderQuickActions } = ChromeUtils.importESModule(
      "moz-src:///browser/components/urlbar/ActionsProviderQuickActions.sys.mjs"
    );
    ActionsProviderQuickActions.getActions = async () => new Set();
    actionsOff = true;
  }

  // Hiding is not enough: customize mode is also reachable through
  // about:customizing, and the toolbar context menu can pin, unpin and remove
  // buttons without entering it. Stub the one entry point and suppress both
  // context menus in every browser window.
  Services.obs.addObserver(win => {
    const noop = () => {};
    disableUrlbarActions();
    win.gCustomizeMode.enter = noop;
    win.gCustomizeMode.toggle = noop;
    win.document.getElementById("cmd_CustomizeToolbars")?.setAttribute("disabled", "true");
    for (const id of ["toolbar-context-menu", "customizationPanelItemContextMenu"]) {
      win.document.getElementById(id)?.addEventListener("popupshowing", event => {
        if (event.target.id === id) {
          event.preventDefault();
        }
      });
    }
    // The sidebar has no policy. The prefs (policies) switch the redesigned one
    // off, which leaves the old one, still opened by shortcuts such as Ctrl+B
    // and Ctrl+H. Every way in ends in one of these methods.
    const sidebar = win.SidebarController;
    if (sidebar) {
      const closed = async () => false;
      for (const method of ["show", "_show", "showInitially", "toggle", "handleToolbarButtonClick", "toggleRevampSidebar"]) {
        sidebar[method] = closed;
      }
      sidebar.toggleVerticalTabs = noop;
      try {
        sidebar.hide();
      } catch (e) {
        // nothing was open
      }
    }
    // The menu bar is hidden (DisplayMenuBar policy and the sheet above), but its
    // menus still open through access keys such as Alt+F.
    win.document.getElementById("main-menubar")?.addEventListener("popupshowing", event => {
      event.preventDefault();
    }, true);
  }, "browser-delayed-startup-finished");

  // about: pages, local files and local addresses. Firefox blocks individual pages
  // through a prefix list of about and chrome URLs, which cannot express an
  // allowlist: several about pages map to about:blank and newtab shares its chrome
  // URL with home. This content policy rejects every document load of an about
  // page outside the list,
  // and every chrome, resource, moz-src, file or jar document loaded into a tab
  // (internal pages under their real URL, and the container's filesystem, secrets
  // included). view-source is rejected outright, since it wraps any of those.
  // Chrome browsing contexts, the browser window and its panels, are untouched.
  // The file picker is not a document load: uploads from ~/Desktop keep working.
  const ALLOWED_ABOUT = new Set([
    "newtab", "home",
    // needed by the browser itself: initial and iframe documents, error pages
    "blank", "srcdoc", "neterror", "certerror", "httpsonlyerror", "blocked",
    "tabcrashed", "framecrashed",
  ]);
  const INTERNAL_SCHEMES = new Set(["chrome", "resource", "moz-src", "file", "jar"]);

  // Local and private addresses, for every load type (pages, subresources, fetch,
  // websockets): the container sits on the gateway overlay and routes to the LAN,
  // so a typed or embedded address would bypass Traefik and reach internal
  // services. Names are covered by DNS: DoH is the only resolver (policies) and
  // drops answers that point at private addresses (network.trr.allow-rfc1918).
  const IPV4_BLOCKED = [
    ["0.0.0.0", 8], ["10.0.0.0", 8], ["100.64.0.0", 10], ["127.0.0.0", 8],
    ["169.254.0.0", 16], ["172.16.0.0", 12], ["192.0.0.0", 24], ["192.168.0.0", 16],
    ["198.18.0.0", 15], ["224.0.0.0", 3],
  ].map(([net, bits]) => [ipv4ToInt(net), bits]);
  function ipv4ToInt(address) {
    return address.split(".").reduce((acc, octet) => acc * 256 + Number(octet), 0);
  }
  function isBlockedIPv4(address) {
    const value = ipv4ToInt(address);
    return IPV4_BLOCKED.some(([net, bits]) => Math.floor(value / 2 ** (32 - bits)) === Math.floor(net / 2 ** (32 - bits)));
  }
  function isBlockedHost(host) {
    host = host.toLowerCase().replace(/^\[|\]$/g, "").replace(/\.$/, "");
    if (host === "localhost" || host.endsWith(".localhost")) {
      return true;
    }
    if (/^\d{1,3}(\.\d{1,3}){3}$/.test(host)) {
      return isBlockedIPv4(host);
    }
    if (host.includes(":")) {
      const mapped = host.match(/^::ffff:(\d{1,3}(?:\.\d{1,3}){3})$/);
      if (mapped) {
        return isBlockedIPv4(mapped[1]);
      }
      // unspecified, loopback, unique local fc00::/7, link local fe80::/10, multicast
      return host === "::" || host === "::1" || /^f[cd]/.test(host) || /^fe[89ab]/.test(host) || host.startsWith("ff");
    }
    return false;
  }

  const Ci = Components.interfaces;
  const policy = {
    classDescription: "Kiosk about page policy",
    contractID: "@swarm-cluster/kiosk-about-policy;1",
    classID: Components.ID("{6f1c2d7e-3b8a-4c55-9e2f-8d4a1b7c0e93}"),
    QueryInterface: ChromeUtils.generateQI(["nsIContentPolicy"]),
    createInstance(iid) {
      return this.QueryInterface(iid);
    },
    shouldLoad(location, loadInfo) {
      let host = "";
      try {
        host = location.host;
      } catch (e) {
        // URIs without a host (about:, data:, blob:)
      }
      if (host && isBlockedHost(host)) {
        return Ci.nsIContentPolicy.REJECT_POLICY;
      }
      const type = loadInfo.externalContentPolicyType;
      if (type !== Ci.nsIContentPolicy.TYPE_DOCUMENT && type !== Ci.nsIContentPolicy.TYPE_SUBDOCUMENT) {
        return Ci.nsIContentPolicy.ACCEPT;
      }
      if (location.scheme === "view-source") {
        return Ci.nsIContentPolicy.REJECT_POLICY;
      }
      if (location.scheme === "about") {
        const page = location.spec.slice("about:".length).split(/[?#]/)[0].toLowerCase();
        return ALLOWED_ABOUT.has(page) ? Ci.nsIContentPolicy.ACCEPT : Ci.nsIContentPolicy.REJECT_POLICY;
      }
      if (INTERNAL_SCHEMES.has(location.scheme) && loadInfo.browsingContext?.isContent) {
        return Ci.nsIContentPolicy.REJECT_POLICY;
      }
      return Ci.nsIContentPolicy.ACCEPT;
    },
    shouldProcess() {
      return Ci.nsIContentPolicy.ACCEPT;
    },
  };
  const registrar = Components.manager.QueryInterface(Ci.nsIComponentRegistrar);
  if (!registrar.isContractIDRegistered(policy.contractID)) {
    registrar.registerFactory(policy.classID, policy.classDescription, policy.contractID, policy);
    Services.catMan.addCategoryEntry("content-policy", policy.contractID, policy.contractID, false, true);
  }
})();

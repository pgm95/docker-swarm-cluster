# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

include:
  - include.yml

services:
  traefik-external:
    image: traefik:v3.7 # Consider hardened dhi.io/traefik:3
    logging:
      <<: *logging
    stop_grace_period: 30s
    command:
      # Global
      - "--global.checkNewVersion=false"
      - "--global.sendAnonymousUsage=false"
      # Logging
      - "--log.level=INFO"
      - "--log.format=common"
      - "--accessLog.format=json"
      - "--accessLog.fields.headers.names.Referer=keep"
      - "--accessLog.fields.headers.names.User-Agent=keep"
      - "--accessLog.fields.headers.names.X-Ip-Country=keep"
      - "--accessLog.fields.headers.names.X-Geoblock-Status=keep"
      - "--accessLog.fields.headers.names.X-Geoblock-Decision=keep"
      # API
      - "--api.insecure=false"
      - "--api.dashboard=false"
      - "--ping=true"
      # Plugins
      - "--experimental.plugins.bouncer.moduleName=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
      - "--experimental.plugins.bouncer.version=v1.7.1"
      - "--experimental.plugins.geoblock.moduleName=github.com/david-garcia-garcia/traefik-geoblock"
      - "--experimental.plugins.geoblock.version=v1.1.4"
      - "--experimental.plugins.geoblock.settings.useunsafe=true"
      # Metrics
      - "--metrics.prometheus.entryPoint=metrics"
      - "--metrics.prometheus.addRoutersLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.buckets=0.1,0.3,1.2,5.0"
      # Providers
      - "--providers.file.watch=true"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.swarm.watch=true"
      - "--providers.swarm.endpoint=http://socket-proxy:2375"
      - "--providers.swarm.exposedByDefault=false"
      - "--providers.swarm.network=infra_gw-external"
      - "--providers.swarm.constraints=Label(`traefik.scope.external`, `true`)"
      # TLS / ACME
      - "--certificatesResolvers.letsencrypt.acme.storage=/certs/acme.json"
      - "--certificatesResolvers.letsencrypt.acme.email=admin@${DOMAIN_PUBLIC}"
      - "--certificatesResolvers.letsencrypt.acme.caServer=${GLOBAL_ACME_CA_SERVER}"
      - "--certificatesResolvers.letsencrypt.acme.dnsChallenge.provider=cloudflare"
      - "--certificatesResolvers.letsencrypt.acme.dnsChallenge.propagation.delayBeforeChecks=30s"
      - "--certificatesResolvers.letsencrypt.acme.dnsChallenge.resolvers=1.1.1.1:53,8.8.8.8:53,9.9.9.9:53"
      # Prometheus
      - "--entryPoints.metrics.address=:9091"
      # HTTPS (websecure)
      - "--entryPoints.websecure.address=:443"
      # Public 443 terminates on the relay VPS, which forwards each client as its own TCP
      # connection with a PROXY protocol v2 header: directly over the WAN (flint DNATs 8443
      # from the relay's address, source preserved) or over the WireGuard tunnel as fallback.
      # Trust the header from those two sources only; any other peer keeps its TCP source.
      - "--entryPoints.websecure.proxyProtocol.trustedIPs=${GLOBAL_VPS_IP_TUNNEL},${GLOBAL_VPS_IP_PUBLIC}"
      - "--entryPoints.websecure.asDefault=true"
      - "--entryPoints.websecure.http.middlewares=security-headers@file,geoblock@file,crowdsec@file"
      - "--entryPoints.websecure.http.tls.certResolver=letsencrypt"
      - "--entryPoints.websecure.http.tls.domains[0].main=${DOMAIN_PUBLIC}"
      - "--entryPoints.websecure.http.tls.domains[0].sans=*.${DOMAIN_PUBLIC}"
      - "--entryPoints.websecure.transport.respondingTimeouts.readTimeout=12h"
      - "--entryPoints.websecure.transport.respondingTimeouts.writeTimeout=12h"
      - "--entryPoints.websecure.transport.respondingTimeouts.idleTimeout=90s"
      # Reject path-encoded reserved characters to prevent split-view attacks
      - "--entryPoints.websecure.http.encodedCharacters.allowEncodedSlash=false"
      - "--entryPoints.websecure.http.encodedCharacters.allowEncodedBackSlash=false"
      - "--entryPoints.websecure.http.encodedCharacters.allowEncodedNullCharacter=false"
      - "--entryPoints.websecure.http.encodedCharacters.allowEncodedSemicolon=false"
      - "--entryPoints.websecure.http.encodedCharacters.allowEncodedPercent=false"
      - "--entryPoints.websecure.http.encodedCharacters.allowEncodedQuestionMark=false"
      - "--entryPoints.websecure.http.encodedCharacters.allowEncodedHash=false"
    environment:
      - GOMEMLIMIT=920MiB
      - DOMAIN_PUBLIC=${DOMAIN_PUBLIC}
      - AUTHENTIK_URL=${GATEWAY_EXTERNAL_AUTHENTIK_URL}
      - CLOUDFLARE_DNS_API_TOKEN_FILE=/run/secrets/global_cloudflare_acme_public_token
      - GEOBLOCK_IP2LOCATION_TOKEN=${GATEWAY_EXTERNAL_GEOBLOCK_TOKEN}
    secrets:
      - global_cloudflare_acme_public_token
      - gateway_external_bouncer_key
    configs:
      - source: gateway_external_traefik_dynamic_base
        target: /etc/traefik/dynamic/base.yml
      - source: gateway_external_traefik_dynamic_authentik
        target: /etc/traefik/dynamic/authentik.yml
      - source: gateway_external_traefik_dynamic_bouncer
        target: /etc/traefik/dynamic/bouncer.yml
      - source: gateway_external_traefik_dynamic_geoblock
        target: /etc/traefik/dynamic/geoblock.yml
      - source: gateway_external_traefik_dynamic_hass_public
        target: /etc/traefik/dynamic/hass-public.yml
    networks:
      - default
      - infra_socket
      - infra_gw-external
      - infra_metrics
    ports:
      # 8443 on the node: the internal gateway owns host 443 on the same node, and only the
      # relay VPS talks to this entrypoint, through the router's DNATs (WAN and tunnel).
      - target: 443
        published: 8443
        protocol: tcp
        mode: host
    volumes:
      - traefik-certs:/certs
      - traefik-geoblock:/data/geoblock
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      <<: [*place-main, *deploy]
      update_config:
        order: stop-first
      labels:
        - "crowdsec.enable=true"
        - "homepage.group=no-widget"
        - "homepage.name=Traefik External"
        - "homepage.icon=traefik"
      mode: replicated
      replicas: 1
      resources:
        <<: *resources-huge

  crowdsec:
    image: crowdsecurity/crowdsec:v1.7.8
    entrypoint: ["/bin/bash", "/crowdsec-entrypoint.sh"]
    logging:
      <<: *logging
    stop_grace_period: 30s
    environment:
      - USE_TLS=false
      - METRICS_PORT=6060
      - TZ=${GLOBAL_TZ_LOCAL}
      - LOCAL_API_URL=http://0.0.0.0:8085
      - PARSERS=crowdsecurity/geoip-enrich crowdsecurity/whitelists crowdsecurity/jellyfin-whitelist
      - COLLECTIONS=crowdsecurity/traefik crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules crowdsecurity/base-http-scenarios
      - AGENT_USERNAME=${WIDGET_CROWDSEC_USER}
      # Uncomment these when redeploying frequently to avoid CAPI rate-limits
      # - NO_HUB_UPGRADE=true
      # - DISABLE_ONLINE_API=true
      # Hub enrollment is only needed once, comment these after first run
      # - ENROLL_KEY=${GATEWAY_EXTERNAL_CROWDSEC_ENROLL_KEY}
      # - ENROLL_TAGS=Swarm Prod Traefik
      # - ENROLL_INSTANCE_NAME=swarm-cluster
    secrets:
      - gateway_external_bouncer_key
      - gateway_external_crowdsec_cti_key
      - gateway_external_crowdsec_db_password
      - widget_crowdsec_password
    configs:
      - source: gateway_external_crowdsec_entrypoint
        target: /crowdsec-entrypoint.sh
      - source: gateway_external_crowdsec_acquis
        target: /etc/crowdsec/acquis.yaml
      - source: gateway_external_crowdsec_profiles
        target: /etc/crowdsec/profiles.yaml
      - source: gateway_external_crowdsec_config
        target: /etc/crowdsec/config.yaml.local
      - source: gateway_external_crowdsec_notifications
        target: /etc/crowdsec/notifications/http.yaml
      - source: gateway_external_crowdsec_console
        target: /etc/crowdsec/console.yaml
      - source: gateway_external_crowdsec_whitelist_rejected
        target: /etc/crowdsec/parsers/s02-enrich/01-gateway-rejections.yaml
    networks:
      - default
      - infra_socket
      - infra_metrics
      - infra_postgres
    volumes:
      - crowdsec-app:/etc/crowdsec
      - crowdsec-data:/var/lib/crowdsec/data
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      <<: [*place-main, *deploy]
      update_config:
        failure_action: continue
        order: stop-first
      labels:
        - "homepage.name=Crowdsec"
        - "homepage.icon=crowdsec"
        - "homepage.group=Infrastructure"
        - "homepage.href=https://app.crowdsec.net/security-engines"
        - "homepage.widget.type=crowdsec"
        - "homepage.widget.username=${WIDGET_CROWDSEC_USER}"
        - "homepage.widget.password={{HOMEPAGE_FILE_WIDGET_CROWDSEC_PASSWORD}}"
        - "homepage.widget.url=http://crowdsec:8085"
        - 'homepage.widget.fields=["alerts", "bans"]'
      mode: replicated
      replicas: 1
      resources:
        <<: *resources-large

  init-db:
    image: postgres:17-alpine
    entrypoint: ["/bin/sh", "/init-db-entrypoint.sh"]
    logging:
      <<: *logging
    stop_grace_period: 30s
    environment:
      - GLOBAL_DB_PROVISIONER_USER=${GLOBAL_DB_PROVISIONER_USER}
    secrets:
      - global_db_provisioner_password
      - gateway_external_crowdsec_db_password
    configs:
      - source: gateway_external_init_db
        target: /init-db-entrypoint.sh
    networks:
      - infra_postgres
    healthcheck:
      test: ["NONE"]
    deploy:
      <<: [*place-main, *deploy-init]
      mode: replicated
      replicas: 1
      resources:
        <<: *resources-tiny

volumes:
  traefik-certs:
  traefik-geoblock:
  crowdsec-app:
  crowdsec-data:

networks:
  infra_gw-external:
    external: true
  infra_socket:
    external: true
  infra_metrics:
    external: true
  infra_postgres:
    external: true

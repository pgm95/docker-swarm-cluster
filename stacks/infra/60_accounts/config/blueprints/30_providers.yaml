      policy_engine_mode: any
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      order: 0
      target: !KeyOf app-grafana
    attrs:
      group: !Find [authentik_core.group, [name, !Env GLOBAL_ADMIN_GROUP]]

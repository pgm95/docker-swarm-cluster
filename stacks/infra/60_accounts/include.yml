secrets:
  accounts_lldap_db_url:
    name: accounts_lldap_db_url_${DEPLOY_VERSION}
    external: true
  global_db_provisioner_password:
    name: global_db_provisioner_password_${DEPLOY_VERSION}
    external: true
  # Core Authentik (versioned)
  accounts_authentik_secret_key:
    name: accounts_authentik_secret_key_${DEPLOY_VERSION}
    external: true
  accounts_authentik_db_password:
    name: accounts_authentik_db_password_${DEPLOY_VERSION}
    external: true

  # lldap server (versioned)
  accounts_lldap_jwt_secret_key:
    name: accounts_lldap_jwt_secret_key_${DEPLOY_VERSION}
    external: true
  accounts_lldap_key_seed:
    name: accounts_lldap_key_seed_${DEPLOY_VERSION}
    external: true

  # Service account passwords seeded by init-ldap, consumed by Authentik LDAP source / Jellyfin LDAP plugin
  ldap_authentik_bind_password:
    name: ldap_authentik_bind_password_${DEPLOY_VERSION}
    external: true
  ldap_jellyfin_bind_password:
    name: ldap_jellyfin_bind_password_${DEPLOY_VERSION}
    external: true
  ldap_test_user_password:
    name: ldap_test_user_password_${DEPLOY_VERSION}
    external: true

  # Shared (versioned, remapped from GLOBAL_SECRETS)
  global_smtp_password:
    name: global_smtp_password_${DEPLOY_VERSION}
    external: true
  global_admin_password:
    name: global_admin_password_${DEPLOY_VERSION}
    external: true

  # OIDC client secrets (versioned)
  oidc_mealie_client_secret:
    name: oidc_mealie_client_secret_${DEPLOY_VERSION}
    external: true
  oidc_dawarich_client_secret:
    name: oidc_dawarich_client_secret_${DEPLOY_VERSION}
    external: true
  oidc_quantum_client_secret:
    name: oidc_quantum_client_secret_${DEPLOY_VERSION}
    external: true
  oidc_immich_client_secret:
    name: oidc_immich_client_secret_${DEPLOY_VERSION}
    external: true
  oidc_grafana_client_secret:
    name: oidc_grafana_client_secret_${DEPLOY_VERSION}
    external: true
  oidc_tailscale_client_secret:
    name: oidc_tailscale_client_secret_${DEPLOY_VERSION}
    external: true
  oidc_stirling_client_secret:
    name: oidc_stirling_client_secret_${DEPLOY_VERSION}
    external: true
  oidc_firefox_password:
    name: oidc_firefox_password_${DEPLOY_VERSION}
    external: true

  # Homepage widget API token, written by the service accounts blueprint (versioned)
  widget_authentik_api_key:
    name: widget_authentik_api_key_${DEPLOY_VERSION}
    external: true
  # Gatus blueprint check API token, written by the service accounts blueprint (versioned)
  widget_authentik_gatus_api_key:
    name: widget_authentik_gatus_api_key_${DEPLOY_VERSION}
    external: true

configs:
  accounts_authentik_blueprint_directory:
    name: accounts_authentik_blueprint_directory_${DEPLOY_VERSION}
    file: ./config/blueprints/10_directory.yaml
  accounts_authentik_blueprint_scope_mappings:
    name: accounts_authentik_blueprint_scope_mappings_${DEPLOY_VERSION}
    file: ./config/blueprints/20_scope-mappings.yaml
  accounts_authentik_blueprint_ldap_source:
    name: accounts_authentik_blueprint_ldap_source_${DEPLOY_VERSION}
    file: ./config/blueprints/25_ldap-source.yaml
  accounts_authentik_blueprint_providers:
    name: accounts_authentik_blueprint_providers_${DEPLOY_VERSION}
    file: ./config/blueprints/30_providers.yaml
  accounts_authentik_blueprint_proxy_providers:
    name: accounts_authentik_blueprint_proxy_providers_${DEPLOY_VERSION}
    file: ./config/blueprints/35_proxy-providers.yaml
  accounts_authentik_blueprint_service_accounts:
    name: accounts_authentik_blueprint_service_accounts_${DEPLOY_VERSION}
    file: ./config/blueprints/40_service-accounts.yaml
  accounts_authentik_blueprint_brand:
    name: accounts_authentik_blueprint_brand_${DEPLOY_VERSION}
    file: ./config/blueprints/50_brand.yaml
  accounts_authentik_blueprint_links:
    name: accounts_authentik_blueprint_links_${DEPLOY_VERSION}
    file: ./config/blueprints/45_links.yaml
  accounts_lldap_config:
    name: accounts_lldap_config_${DEPLOY_VERSION}
    file: ./config/lldap/lldap_config.toml
  accounts_init_db:
    name: accounts_init_db_${DEPLOY_VERSION}
    file: ./config/bootstrap/init-db.sh
  accounts_init_ldap:
    name: accounts_init_ldap_${DEPLOY_VERSION}
    file: ./config/bootstrap/init-ldap.sh

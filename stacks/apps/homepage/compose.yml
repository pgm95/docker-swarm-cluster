# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

include:
  - include.yml

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    user: ${GLOBAL_NONROOT_DOCKER}
    logging:
      <<: *logging
    stop_grace_period: 30s
    environment:
      - LOG_TARGETS=stdout
      - HOMEPAGE_ALLOWED_HOSTS=dash.${DOMAIN_PRIVATE}
      - HOMEPAGE_VAR_GLOBAL_ADMIN_USER=${GLOBAL_ADMIN_USER}
      - HOMEPAGE_FILE_GLOBAL_ADMIN_PASSWORD=/run/secrets/global_admin_password
      - HOMEPAGE_VAR_DOMAIN_PRIVATE=${DOMAIN_PRIVATE}
      - HOMEPAGE_VAR_DOMAIN_PUBLIC=${DOMAIN_PUBLIC}
      - HOMEPAGE_FILE_JELLYFIN_API_KEY=/run/secrets/homepage_jellyfin_api_key
      - HOMEPAGE_FILE_MEALIE_API_KEY=/run/secrets/homepage_mealie_api_key
      - HOMEPAGE_FILE_IMMICH_API_KEY=/run/secrets/homepage_immich_api_key
      - HOMEPAGE_FILE_SEERR_API_KEY=/run/secrets/homepage_seerr_api_key
      - HOMEPAGE_VAR_PVE_NUC_USER=${HOMEPAGE_PVE_NUC_USER}
      - HOMEPAGE_FILE_PVE_NUC_PASSWORD=/run/secrets/homepage_pve_nuc_password
      - HOMEPAGE_VAR_PVE_NAS_USER=${HOMEPAGE_PVE_NAS_USER}
      - HOMEPAGE_FILE_PVE_NAS_PASSWORD=/run/secrets/homepage_pve_nas_password
      - HOMEPAGE_FILE_HASS_TOKEN=/run/secrets/homepage_hass_token
      - HOMEPAGE_FILE_WIDGET_SYNCTHING_API_KEY=/run/secrets/widget_syncthing_api_key
      - HOMEPAGE_FILE_WIDGET_RADARR_API_KEY=/run/secrets/widget_radarr_api_key
      - HOMEPAGE_FILE_WIDGET_SONARR_API_KEY=/run/secrets/widget_sonarr_api_key
      - HOMEPAGE_FILE_WIDGET_PROWLARR_API_KEY=/run/secrets/widget_prowlarr_api_key
      - HOMEPAGE_FILE_WIDGET_CROWDSEC_PASSWORD=/run/secrets/widget_crowdsec_password
      - HOMEPAGE_VAR_GLUETUN_API_KEY=${HOMEPAGE_GLUETUN_API_KEY}
      - HOMEPAGE_FILE_AUTHENTIK_API_KEY=/run/secrets/homepage_authentik_api_key
    secrets:
      - homepage_jellyfin_api_key
      - homepage_mealie_api_key
      - homepage_immich_api_key
      - homepage_seerr_api_key
      - homepage_authentik_api_key
      - homepage_pve_nuc_password
      - homepage_pve_nas_password
      - homepage_hass_token
      - global_admin_password
      - widget_syncthing_api_key
      - widget_radarr_api_key
      - widget_sonarr_api_key
      - widget_prowlarr_api_key
      - widget_crowdsec_password
    configs:
      - source: homepage_settings
        target: /app/config/settings.yaml
      - source: homepage_bookmarks
        target: /app/config/bookmarks.yaml
      - source: homepage_widgets
        target: /app/config/widgets.yaml
      - source: homepage_docker
        target: /app/config/docker.yaml
      - source: homepage_custom_css
        target: /app/config/custom.css
      - source: homepage_custom_js
        target: /app/config/custom.js
      - source: homepage_services
        target: /app/config/services.yaml
      - source: homepage_kubernetes
        target: /app/config/kubernetes.yaml
      - source: homepage_proxmox
        target: /app/config/proxmox.yaml
    networks:
      - infra_gw-internal
      - infra_socket
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      <<: [*place-main, *deploy]
      update_config:
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.scope.internal=true"
        - "traefik.http.routers.homepage.rule=Host(`dash.${DOMAIN_PRIVATE}`)"
        - "traefik.http.routers.homepage.entrypoints=websecure"
        - "traefik.http.services.homepage.loadbalancer.server.port=3000"
      mode: replicated
      replicas: 1
      resources:
        <<: *resources-medium

networks:
  infra_gw-internal:
    external: true
  infra_socket:
    external: true

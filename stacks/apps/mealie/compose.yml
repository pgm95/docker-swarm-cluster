# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

include:
  - include.yml

services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    logging:
      <<: *logging
    stop_grace_period: 30s
    environment:
      # Core settings
      - PUID=${GLOBAL_NONROOT_PUID}
      - PGID=${GLOBAL_NONROOT_PGID}
      - TZ=${GLOBAL_TZ_LOCAL}
      - API_PORT=9025
      - API_DOCS=false
      - LOG_LEVEL=warning
      - ALLOW_SIGNUP=false
      - DB_ENGINE=postgres
      - POSTGRES_USER=mealie
      - POSTGRES_PASSWORD_FILE=/run/secrets/mealie_db_password
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=mealie
      - BASE_URL=https://recipes.${DOMAIN_PUBLIC}
      # OIDC Configuration
      - OIDC_AUTH_ENABLED=true
      - OIDC_SIGNUP_ENABLED=true
      - OIDC_REMEMBER_ME=true
      - OIDC_AUTO_REDIRECT=true
      - OIDC_PROVIDER_NAME=Authentik
      - OIDC_SCOPES=openid profile email groups
      - OIDC_ADMIN_GROUP=${GLOBAL_ADMIN_GROUP}
      - OIDC_USER_GROUP=${GLOBAL_USER_GROUP}
      - OIDC_CONFIGURATION_URL=https://auth.${DOMAIN_PUBLIC}/application/o/mealie/.well-known/openid-configuration
      - OIDC_CLIENT_ID=${OIDC_MEALIE_CLIENT_ID}
      - OIDC_CLIENT_SECRET_FILE=/run/secrets/oidc_mealie_client_secret
      # - ALLOW_PASSWORD_LOGIN=false
      # SMTP Configuration
      - SMTP_PORT=587
      - SMTP_AUTH_STRATEGY=TLS
      - SMTP_FROM_NAME=Mealie
      - SMTP_HOST=${GLOBAL_SMTP_HOST}
      - SMTP_USER=${GLOBAL_SMTP_USER}
      - SMTP_PASSWORD_FILE=/run/secrets/global_smtp_password
      - SMTP_FROM_EMAIL=noreply@${DOMAIN_PUBLIC}
      # OpenAI Integration
      - OPENAI_API_KEY_FILE=/run/secrets/mealie_openai_api_key
    secrets:
      - oidc_mealie_client_secret
      - mealie_openai_api_key
      - mealie_db_password
      - global_smtp_password
    networks:
      - infra_gw-external
      - infra_postgres
    volumes:
      - mealie-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9025/api/app/about"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      <<: [*place-main, *deploy]
      update_config:
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.scope.external=true"
        - "traefik.http.routers.mealie.rule=Host(`recipes.${DOMAIN_PUBLIC}`)"
        - "traefik.http.routers.mealie.entrypoints=websecure"
        - "traefik.http.services.mealie.loadbalancer.server.port=9025"
        - "homepage.group=Applications"
        - "homepage.name=Mealie"
        - "homepage.icon=mealie"
        - "homepage.href=https://recipes.${DOMAIN_PUBLIC}"
        - "homepage.widget.type=mealie"
        - "homepage.widget.url=https://recipes.${DOMAIN_PUBLIC}"
        - "homepage.widget.key={{HOMEPAGE_FILE_MEALIE_API_KEY}}"
        - "homepage.widget.version=2"
      mode: replicated
      replicas: 1
      resources:
        <<: *resources-huge

  init-db:
    image: postgres:17-alpine
    entrypoint: ["/bin/sh", "/init-db-entrypoint.sh"]
    logging:
      <<: *logging
    stop_grace_period: 30s
    environment:
      - GLOBAL_DB_PROVISIONER_USER=${GLOBAL_DB_PROVISIONER_USER}
    secrets:
      - global_db_provisioner_password
      - mealie_db_password
    configs:
      - source: mealie_init_db
        target: /init-db-entrypoint.sh
    networks:
      - infra_postgres
    healthcheck:
      test: ["NONE"]
    deploy:
      <<: [*place-main, *deploy-init]
      mode: replicated
      replicas: 1
      resources:
        <<: *resources-tiny

volumes:
  mealie-data:

networks:
  infra_gw-external:
    external: true
  infra_postgres:
    external: true

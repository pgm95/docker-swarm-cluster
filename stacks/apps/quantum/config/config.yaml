server:
  minSearchLength: 3
  disableUpdateCheck: false
  disablePreviews: false
  disablePreviewResize: false
  disableTypeDetectionByHeader: false
  logging:
    - output: "stdout"
      noColors: false
  cacheDir: "tmp"
  maxArchiveSize: 50
  filesystem:
    createFilePermission: "660"
    createDirectoryPermission: "770"
  database:
    path: "" # Set via FILEBROWSER_DATABASE_PATH
    # migrateFrom: "/quantum/db/data.db" # Old boltdb file

  sources:
    - path: "/mnt/personal"
      name: "Personal"
      config:
        denyByDefault: false
        private: false
        disabled: false
        defaultUserScope: "/"
        defaultEnabled: true
        createUserDir: false
        rules:
          - folderPath: "/"
            viewable: true
    - path: "/mnt/photos"
      name: "Photos"
      config:
        denyByDefault: false
        private: false
        disabled: false
        defaultUserScope: "/"
        defaultEnabled: true
        createUserDir: false
        rules:
          - folderPath: "/"
            viewable: true
    - path: "/mnt/media"
      name: "Media"
      config:
        denyByDefault: false
        private: false
        disabled: false
        defaultUserScope: "/"
        defaultEnabled: true
        createUserDir: false
        rules:
          - folderPath: "/"
            viewable: true
    # - path: "/mnt/apple"
    #   name: "Apple"
    #   config:
    #     denyByDefault: false
    #     private: false
    #     disabled: false
    #     defaultUserScope: "/"
    #     defaultEnabled: true
    #     createUserDir: false
    #     rules:
    #       - folderPath: "/"
    #         viewable: true

http:
  port: 8080
  baseURL: "/"
  externalUrl: ""
  internalUrl: "http://127.0.0.1:8080"

auth:
  tokenExpirationHours: 120
  adminUsername: "root"
  adminPassword: "" # Set via FILEBROWSER_ADMIN_PASSWORD
  methods:
    password:
      enabled: true
      minLength: 5
      signup: false
    oidc:
      enabled: true
      clientId: "" # Set via FILEBROWSER_OIDC_CLIENT_ID
      clientSecret: "" # Set via FILEBROWSER_OIDC_CLIENT_SECRET
      issuerUrl: "https://auth.${DOMAIN_PUBLIC}/application/o/quantum/"
      scopes: "email openid profile groups"
      userIdentifier: "preferred_username"
      disableVerifyTLS: false
      logoutRedirectUrl: ""
      createUser: true
      adminGroup: "app_admin"
      groupsClaim: "groups"

frontend:
  name: "Quantum"
  disableNavButtons: false
  disableDefaultLinks: true
  disableUsedPercentage: false
  description: "NAS - SATA ZFS Pool"

userDefaults:
  listing:
    showHidden: true
    quickDownload: true
    showSelectMultiple: true
    singleClick: true
  ui:
    darkMode: true
    themeColor: "#363636"
  account:
    disableSettings: false

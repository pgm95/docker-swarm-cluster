# yaml-language-server: $schema=https://json.schemastore.org/pre-commit-config.json

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: check-yaml
        args: [--unsafe]
        exclude: ^\.secrets/
      - id: check-json
      - id: check-case-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .config/yamllint.yaml]
        exclude: ^\.secrets/

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        args: [--config, .config/.markdownlint-cli2.jsonc, --fix]

  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: v1.2.7
    hooks:
      - id: tombi-format
        types: [toml]
        exclude: ^stacks/
      - id: tombi-lint
        types: [toml]
        exclude: ^stacks/

  - repo: local
    hooks:

      - id: ruff
        name: ruff fix
        entry: mise run validate:ruff -- --fix
        language: system
        files: ^\.mise/python/
        pass_filenames: false

      - id: pytest
        name: Run Python tests
        entry: mise run validate:pytest
        always_run: true
        language: system
        pass_filenames: false

      - id: check-secrets-encrypted
        name: Check secrets are SOPS-encrypted
        entry: "sh -c 'for f in \"$@\"; do grep -q \"^sops_\" \"$f\" || grep -q \"^sops:\" \"$f\" || { echo \"PLAINTEXT: $f\"; exit 1; }; done' --"
        language: system
        files: (^\.secrets/.*\.yaml$|secrets\.env$)

      - id: compose-validate
        name: Validate compose files
        entry: mise run validate:compose
        language: system
        files: ^stacks/(.*/(compose|configs|secrets)\.yml|.*/config/|_shared/anchors\.yml)
        pass_filenames: false

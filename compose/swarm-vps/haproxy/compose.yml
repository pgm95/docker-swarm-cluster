# Relay VPS: public 443 to the home gateway. Pure Compose (no Swarm), deployed
# with `compose:deploy swarm-vps/haproxy`. Design, paths and operating notes are
# in README.md next to this file.
#
# No address of this host appears anywhere: listeners bind by interface and the
# tunnel side is the router's fixed address, so dev and prod run the same file.
# Environment differences live in the mise profile, not here. A config change
# is a container recreate; do it in a window.

name: relay

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  haproxy:
    build:
      context: ./build/haproxy
    image: relay-haproxy:local
    container_name: relay-haproxy
    # Host networking: binds the public address and the tunnel address directly,
    # no NAT, no published ports, nothing for dockerd to rewrite in the firewall.
    network_mode: host
    # Starts as root only to bind :443 in the host namespace; the global
    # `user haproxy` in the config drops every worker. No capability beyond
    # those three survives.
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    read_only: true
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    environment:
      PUBLIC_INTERFACE: eth0
      WG_INTERFACE: wg0
      WG_HOME_ADDR: 10.60.60.1
      HOME_PORT: 8443
    volumes:
      - haproxy-run:/run/haproxy
    tmpfs:
      - /tmp:size=8m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8405/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 60s
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 256M
          pids: 256
        reservations:
          memory: 64M

  endpoint:
    # Learns the home public address from the WireGuard peer's endpoint and
    # sets it on the `home` server through HAProxy's runtime API. Needs the
    # host network namespace and NET_ADMIN for `wg show`; nothing else.
    build:
      context: ./build/endpoint
    image: relay-endpoint:local
    container_name: relay-endpoint
    network_mode: host
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    read_only: true
    init: true
    environment:
      WG_INTERFACE: wg0
      HOME_PORT: 8443
      HAPROXY_BACKEND: relay_out
      HAPROXY_SERVER: home
      # Fast poll until HAProxy carries a real home address (a recreated
      # haproxy container starts on the placeholder), slow poll afterwards.
      INTERVAL_INIT: "1"
      INTERVAL: "10"
    volumes:
      - haproxy-run:/run/haproxy
    depends_on:
      haproxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-S", "/run/haproxy/admin.sock"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 10s
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 32M
          pids: 32

volumes:
  # Holds the HAProxy admin socket shared with the endpoint sidecar. Named, not
  # tmpfs, so both containers see the same inode.
  haproxy-run:

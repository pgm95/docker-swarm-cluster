#:schema https://mise.jdx.dev/schema/mise-task.json

["swarm:deploy"]
description = "Deploy one or more stacks"
usage = '''
arg "<stacks>..." help="Stack name(s) or path(s)"
flag "--update" help="Re-resolve mutable image tags (e.g. latest, release) against the registry"
'''
depends = ["swarm:init-networks"]
env.CONVERGE_TIMEOUT = "180"
env.CONVERGE_MAX_INTERVAL = "15"
run = '''
{% raw %}
#!/usr/bin/env bash
failed=()
for s in $usage_stacks; do
    python3 -m swarm.deploy "$s" ${usage_update:+--update} || failed+=("$s")
done
[[ ${#failed[@]} -eq 0 ]] || { echo "Failed: ${failed[*]}" >&2; exit 1; }
{% endraw %}
'''

["swarm:remove"]
description = "Remove one or more stacks and wait for services to drain"
usage = 'arg "<stacks>..." help="Stack name(s) or path(s)"'
run = '''
{% raw %}
#!/usr/bin/env bash
failed=()
for s in $usage_stacks; do
    python3 -m swarm.remove "$s" || failed+=("$s")
done
[[ ${#failed[@]} -eq 0 ]] || { echo "Failed: ${failed[*]}" >&2; exit 1; }
{% endraw %}
'''

["swarm:cleanup"]
alias = "cleanup"
description = "Remove unused versioned secrets/configs and run docker system prune on every node"
run = "python3 -m swarm.cleanup"

["swarm:init-networks"]
description = "Internal: create overlay networks (idempotent)"
hide = true
env.SWARM_INTERNAL_NETWORKS = "infra_socket"
env.SWARM_OVERLAY_MTU = "1280"
run = "python3 -m swarm.networks init"

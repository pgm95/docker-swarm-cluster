    name: gateway_external_crowdsec_notifications_${DEPLOY_VERSION}
    file: ./config/crowdsec/notifications-http.yaml
  gateway_external_crowdsec_whitelist_rejected:
    name: gateway_external_crowdsec_whitelist_rejected_${DEPLOY_VERSION}
    file: ./config/crowdsec/whitelist-rejected.yaml
  gateway_external_init_db:
    name: gateway_external_init_db_${DEPLOY_VERSION}
    file: ./config/bootstrap/init-db.sh

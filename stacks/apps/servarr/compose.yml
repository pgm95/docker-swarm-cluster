# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

include:
  - include.yml

services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    entrypoint: ["/bin/sh", "/init.sh"]
    logging:
      <<: *logging
    stop_grace_period: 30s
    environment:
      - PORT=5055
      - LOG_LEVEL=info
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=seerr
      - DB_USER=seerr
    secrets:
      - servarr_seerr_db_password
    configs:
      - source: servarr_seerr_init
        target: /init.sh
    networks:
      - infra_gw-internal
      - infra_gw-external
      - infra_postgres
    volumes:
      - seerr-data:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    deploy:
      <<: [*place-main, *deploy]
      update_config:
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.http.services.seerr.loadbalancer.server.port=5055"
        - "traefik.scope.external=true"
        - "traefik.http.routers.seerr-external.rule=Host(`request.${DOMAIN_PUBLIC}`)"
        - "traefik.http.routers.seerr-external.entrypoints=websecure"
        - "traefik.http.routers.seerr-external.service=seerr"
        - "homepage.group=Media"
        - "homepage.name=Seerr"
        - "homepage.icon=seerr"
        - "homepage.href=https://request.${DOMAIN_PUBLIC}"
        - "homepage.widget.type=seerr"
        - "homepage.widget.url=https://request.${DOMAIN_PUBLIC}"
        - "homepage.widget.key={{HOMEPAGE_FILE_SEERR_API_KEY}}"
        - 'homepage.widget.fields=["pending", "approved", "available", "completed"]'
      mode: replicated
      replicas: 1
      resources:
        <<: *resources-huge
  radarr:
    image: linuxserver/radarr:latest
    logging:
      <<: *logging
    stop_grace_period: 30s
    environment:
      - PUID=${GLOBAL_NONROOT_PUID}
      - PGID=${GLOBAL_NONROOT_PGID}
      - FILE__RADARR__AUTH__APIKEY=/run/secrets/widget_radarr_api_key
      - RADARR__POSTGRES__HOST=postgres
      - RADARR__POSTGRES__PORT=5432
      - RADARR__POSTGRES__USER=radarr
      - FILE__RADARR__POSTGRES__PASSWORD=/run/secrets/servarr_radarr_db_password
      - RADARR__POSTGRES__MAINDB=radarr-main
      - RADARR__POSTGRES__LOGDB=radarr-log
    secrets:
      - widget_radarr_api_key
      - servarr_radarr_db_password
    networks:
      - infra_gw-internal
      - infra_postgres
    volumes:
      - radarr-data:/config
      - cifs-media:/servarr
    healthcheck:
      test: curl -sf http://127.0.0.1:7878/ping || exit 1
      start_period: 60s
      timeout: 5s
      interval: 15s
      retries: 3
    deploy:
      <<: [*place-main, *deploy]
      update_config:
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.scope.internal=true"
        - "traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN_PRIVATE}`)"
        - "traefik.http.routers.radarr.entrypoints=websecure"
        - "traefik.http.services.radarr.loadbalancer.server.port=7878"
        - "homepage.group=Media"
        - "homepage.name=Radarr"
        - "homepage.icon=radarr"
        - "homepage.href=https://radarr.${DOMAIN_PRIVATE}"
        - "homepage.widget.type=radarr"
        - "homepage.widget.url=https://radarr.${DOMAIN_PRIVATE}"
        - "homepage.widget.key={{HOMEPAGE_FILE_WIDGET_RADARR_API_KEY}}"
        - "homepage.widget.enableQueue=false"
        - 'homepage.widget.fields=["wanted", "queued", "movies"]'
      mode: replicated
      replicas: 1
      resources:
        <<: *resources-huge

  sonarr:
    image: linuxserver/sonarr:latest
    logging:
      <<: *logging
    stop_grace_period: 30s
    environment:
      - PUID=${GLOBAL_NONROOT_PUID}
      - PGID=${GLOBAL_NONROOT_PGID}
      - FILE__SONARR__AUTH__APIKEY=/run/secrets/widget_sonarr_api_key
      - SONARR__POSTGRES__HOST=postgres
      - SONARR__POSTGRES__PORT=5432
      - SONARR__POSTGRES__USER=sonarr
      - FILE__SONARR__POSTGRES__PASSWORD=/run/secrets/servarr_sonarr_db_password
      - SONARR__POSTGRES__MAINDB=sonarr-main
      - SONARR__POSTGRES__LOGDB=sonarr-log
    secrets:
      - widget_sonarr_api_key
      - servarr_sonarr_db_password
    networks:
      - infra_gw-internal
      - infra_postgres
    volumes:
      - sonarr-data:/config
      - cifs-media:/servarr
    healthcheck:
      test: curl -sf http://127.0.0.1:8989/ping || exit 1
      start_period: 60s
      timeout: 5s
      interval: 15s
      retries: 3
    deploy:
      <<: [*place-main, *deploy]
      update_config:
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.scope.internal=true"
        - "traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN_PRIVATE}`)"
        - "traefik.http.routers.sonarr.entrypoints=websecure"
        - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
        - "homepage.group=Media"
        - "homepage.name=Sonarr"
        - "homepage.icon=sonarr"
        - "homepage.href=https://sonarr.${DOMAIN_PRIVATE}"
        - "homepage.widget.type=sonarr"
        - "homepage.widget.url=https://sonarr.${DOMAIN_PRIVATE}"
        - "homepage.widget.key={{HOMEPAGE_FILE_WIDGET_SONARR_API_KEY}}"
        - "homepage.widget.enableQueue=false"
        - 'homepage.widget.fields=["wanted", "queued", "series"]'
      mode: replicated
      replicas: 1
      resources:
        <<: *resources-huge

  prowlarr:
    image: linuxserver/prowlarr:latest
    logging:
      <<: *logging
    stop_grace_period: 30s
    environment:
      - PUID=${GLOBAL_NONROOT_PUID}
      - PGID=${GLOBAL_NONROOT_PGID}
      - FILE__PROWLARR__AUTH__APIKEY=/run/secrets/widget_prowlarr_api_key
      - PROWLARR__POSTGRES__HOST=postgres
      - PROWLARR__POSTGRES__PORT=5432
      - PROWLARR__POSTGRES__USER=prowlarr
      - FILE__PROWLARR__POSTGRES__PASSWORD=/run/secrets/servarr_prowlarr_db_password
      - PROWLARR__POSTGRES__MAINDB=prowlarr-main
      - PROWLARR__POSTGRES__LOGDB=prowlarr-log
    secrets:
      - widget_prowlarr_api_key
      - servarr_prowlarr_db_password
    networks:
      - default
      - infra_gw-internal
      - infra_postgres
    volumes:
      - prowlarr-data:/config
    healthcheck:
      test: curl -sf http://127.0.0.1:9696/ping || exit 1
      start_period: 60s
      timeout: 5s
      interval: 15s
      retries: 3
    deploy:
      <<: [*place-main, *deploy]
      update_config:
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.scope.internal=true"
        - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN_PRIVATE}`)"
        - "traefik.http.routers.prowlarr.entrypoints=websecure"
        - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
        - "homepage.group=Media"
        - "homepage.name=Prowlarr"
        - "homepage.icon=prowlarr"
        - "homepage.href=https://prowlarr.${DOMAIN_PRIVATE}"
        - "homepage.widget.type=prowlarr"
        - "homepage.widget.url=https://prowlarr.${DOMAIN_PRIVATE}"
        - "homepage.widget.key={{HOMEPAGE_FILE_WIDGET_PROWLARR_API_KEY}}"
        - 'homepage.widget.fields=["numberOfGrabs", "numberOfQueries"]'
      mode: replicated
      replicas: 1
      resources:
        <<: *resources-huge

  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    logging:
      <<: *logging
    stop_grace_period: 30s
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
    networks:
      - default
    deploy:
      <<: [*place-main, *deploy]
      update_config:
        order: start-first
      mode: replicated
      replicas: 1
      # Chromium maps about 1 GB of its own image on top of its heap. File pages count
      # against the limit, so at 1024M it evicted and re-read itself on every challenge.
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M

  init-db:
    image: postgres:17-alpine
    entrypoint: ["/bin/sh", "/init-db-entrypoint.sh"]
    logging:
      <<: *logging
    stop_grace_period: 30s
    environment:
      - GLOBAL_DB_PROVISIONER_USER=${GLOBAL_DB_PROVISIONER_USER}
    secrets:
      - global_db_provisioner_password
      - servarr_seerr_db_password
      - servarr_radarr_db_password
      - servarr_sonarr_db_password
      - servarr_prowlarr_db_password
    configs:
      - source: servarr_init_db
        target: /init-db-entrypoint.sh
    networks:
      - infra_postgres
    healthcheck:
      test: ["NONE"]
    deploy:
      <<: [*place-main, *deploy-init]
      mode: replicated
      replicas: 1
      resources:
        <<: *resources-tiny

volumes:
  seerr-data:
  radarr-data:
  sonarr-data:
  prowlarr-data:
  cifs-media:
    driver: local
    driver_opts:
      type: cifs
      device: //${GLOBAL_CIFS_HOST}/media
      o: "username=${GLOBAL_CIFS_USER},password=${GLOBAL_CIFS_PASSWORD},uid=${GLOBAL_NONROOT_PUID},gid=${GLOBAL_NONROOT_PGID},iocharset=utf8"

networks:
  infra_gw-internal:
    external: true
  infra_gw-external:
    external: true
  infra_postgres:
    external: true

# https://github.com/david-garcia-garcia/traefik-geoblock#dynamic-configuration
---
# yaml-language-server: $schema=https://json.schemastore.org/traefik-v3-file-provider.json

http:
  middlewares:
    geoblock:
      plugin:
        geoblock:
          enabled: true
          databaseFilePath: "/plugins-storage/sources/" # included seed db in the plugin source
          databaseAutoUpdate: true
          databaseAutoUpdateDir: "/data/geoblock" # persistent volume for database updates
          databaseAutoUpdateToken: "" # Tokened download URL is broken (upstream issue #55)
          databaseAutoUpdateCode: "DB1"
          defaultAllow: false
          allowPrivate: true
          allowedIPBlocks: []
          allowedCountries: [DK,LB,FR,MX,CA,AE,US,GB,ES,PT]
          blockedCountries: [RU,CN,IN]
          blockedIPBlocks: []
          ipHeaders: # Headers to use for client IPs (required)
            - "remoteAddress" # Real TCP source - cannot be spoofed
          banHtmlFilePath: ""
          ipHeaderStrategy: CheckFirstNonePrivate
          banIfError: false # Block requests if IP lookup fails
          disallowedStatusCode: 403 # HTTP status code for blocked requests.
          logLevel: "info" # Available: debug, info, warn, error
          logFormat: "json" # Available: json, text
          logPath: "" # Empty for Traefik's standard output
          logBannedRequests: false # Log blocked requests. They will be logged at info level.
          countryHeader: "X-Ip-Country"
          logStatusHeader: "X-Geoblock-Status"
          logStatusDetailHeader: "X-Geoblock-Decision"

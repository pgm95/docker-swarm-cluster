      client_type: confidential
      client_id: !Env OIDC_GRAFANA_CLIENT_ID
      client_secret: !File /run/secrets/oidc_grafana_client_secret
      redirect_uris:
        - url: !Format ["https://grafana.%s/login/generic_oauth", !Env DOMAIN_PRIVATE]
          matching_mode: strict
      property_mappings:

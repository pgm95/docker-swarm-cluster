global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

alerting:
  alertmanagers:
  - static_configs:
    - targets: []
    scheme: http
    timeout: 10s
    api_version: v2

rule_files:
  - "node_rules.yml"

scrape_configs:

  # Self-monitoring
  - job_name: prometheus
    honor_timestamps: true
    static_configs:
      - targets:
        - 127.0.0.1:9090

  # Traefik external
  - job_name: traefik-external
    static_configs:
      - targets:
        - traefik-external:9091

  # Traefik internal
  - job_name: traefik-internal
    static_configs:
      - targets:
        - traefik-internal:9091

  # CrowdSec
  - job_name: crowdsec
    static_configs:
      - targets:
        - crowdsec:6060

  # Loki
  - job_name: loki
    static_configs:
      - targets:
        - loki:3100

  # Alloy (global service: one instance per node)
  - job_name: alloy
    dockerswarm_sd_configs:
      - host: http://socket-proxy:2375
        role: tasks
        port: 12345
    relabel_configs:
      - source_labels: [__meta_dockerswarm_service_name]
        regex: logging_alloy
        action: keep
      - source_labels: [__meta_dockerswarm_task_desired_state]
        regex: running
        action: keep
      - source_labels: [__meta_dockerswarm_network_name]
        regex: infra_metrics
        action: keep
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: instance

  # Node Exporter (global service: one instance per node)
  - job_name: node
    dockerswarm_sd_configs:
      - host: http://socket-proxy:2375
        role: tasks
        port: 9100
    relabel_configs:
      - source_labels: [__meta_dockerswarm_service_name]
        regex: metrics_node-exporter
        action: keep
      - source_labels: [__meta_dockerswarm_task_desired_state]
        regex: running
        action: keep
      - source_labels: [__meta_dockerswarm_network_name]
        regex: infra_metrics
        action: keep
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: instance

  # Registry
  - job_name: registry
    metrics_path: /metrics
    static_configs:
      - targets:
        - registry:5001

  # Syncthing
  - job_name: syncthing
    metrics_path: /metrics
    bearer_token_file: /run/secrets/syncthing_api_key
    static_configs:
      - targets:
        - syncthing:8384

  # cAdvisor (global service: one instance per node)
  - job_name: cadvisor
    dockerswarm_sd_configs:
      - host: http://socket-proxy:2375
        role: tasks
        port: 8080
    relabel_configs:
      - source_labels: [__meta_dockerswarm_service_name]
        regex: cadvisor_cadvisor
        action: keep
      - source_labels: [__meta_dockerswarm_task_desired_state]
        regex: running
        action: keep
      - source_labels: [__meta_dockerswarm_network_name]
        regex: infra_metrics
        action: keep
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: instance

  # Gatus
  - job_name: gatus
    metrics_path: /metrics
    static_configs:
      - targets:
        - gatus:8080

  # Borgmatic (via sidecar exporter)
  - job_name: borgmatic
    fallback_scrape_protocol: PrometheusText0.0.4
    static_configs:
      - targets:
        - borgmatic-exporter:9099

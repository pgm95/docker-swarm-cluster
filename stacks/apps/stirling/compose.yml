# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

include:
  - include.yml

services:
  stirling-pdf:
    image: stirlingtools/stirling-pdf:3.0.0-fat
    entrypoint: ["/bin/sh", "/init.sh"]
    logging:
      <<: *logging
    stop_grace_period: 30s
    environment:
      - PUID=${GLOBAL_NONROOT_PUID}
      - PGID=${GLOBAL_NONROOT_PGID}
      - SHOW_SURVEY=false
      - AIENGINE_ENABLED=false
      - METRICS_ENABLED=false
      - STORAGE_ENABLED=false
      - FORMDETECTION_ENABLED=false
      - STORAGE_SIGNING_ENABLED=false
      - STIRLING_BILLING_ACCOUNTLINK_ENABLED=false

      - ENDPOINTS_GROUPSTOREMOVE=Automation,DeveloperTools,DeveloperDocs
      - ENDPOINTS_TOREMOVE=add-watermark,add-stamp,cert-sign

      - SYSTEM_ENABLEANALYTICS=false
      - SYSTEM_DEFAULTLOCALE=en-US
      - SYSTEM_FRONTENDURL=https://pdf.${DOMAIN_PRIVATE}
      - SYSTEM_BACKENDURL=https://pdf.${DOMAIN_PRIVATE}
      - SYSTEM_CORSALLOWEDORIGINS=https://pdf.${DOMAIN_PRIVATE}
      - SYSTEM_SERVERCERTIFICATE_ENABLED=false
      - SYSTEM_GOOGLEVISIBILITY=false
      - SYSTEM_SHOWUPDATE=true
      - SYSTEM_SHOWUPDATEONLYADMIN=true
      - SYSTEM_FILEUPLOADLIMIT=100MB
      - SYSTEM_ENABLEURLTOPDF=true
      - SYSTEM_ENABLEMOBILESCANNER=true
      - SYSTEM_ENABLEDESKTOPINSTALLSLIDE=false
      - SYSTEM_ENABLEALPHAFUNCTIONALITY=false
      - SYSTEM_SHOWSETTINGSWHENNOLOGIN=false
      - SYSTEM_ENABLEEASTEREGGS=false

      - UI_LANGUAGES=en_US
      - UI_APPNAMENAVBAR=Stirling PDF
      - UI_DEFAULTHIDEUNAVAILABLETOOLS=true
      - UI_DEFAULTHIDEUNAVAILABLECONVERSIONS=true
      - UI_HIDEDISABLEDTOOLS_GOOGLEDRIVE=true
      - UI_HIDEDISABLEDTOOLS_MOBILEQRSCANNER=true

      - SPRINGDOC_APIDOCS_ENABLED=false
      - SPRINGDOC_SWAGGERUI_ENABLED=false

      # SSO users are created as plain users and promoted by the local admin
      # SECURITY_LOGINMETHOD can move to oauth2 once an SSO account is admin
      - SECURITY_ENABLELOGIN=true
      - SECURITY_LOGINMETHOD=oauth2
      - SECURITY_SSOAUTOLOGIN=true
      - SECURITY_INITIALLOGIN_USERNAME=root
      - SECURITY_OAUTH2_ENABLED=true
      - SECURITY_OAUTH2_PROVIDER=authentik
      - SECURITY_OAUTH2_ISSUER=https://auth.${DOMAIN_PUBLIC}/application/o/stirling/
      - SECURITY_OAUTH2_CLIENTID=${OIDC_STIRLING_CLIENT_ID}
      - SECURITY_OAUTH2_SCOPES=openid, profile, email
      - SECURITY_OAUTH2_USEASUSERNAME=preferred_username
      - SECURITY_OAUTH2_AUTOCREATEUSER=true
      - SECURITY_OAUTH2_BLOCKREGISTRATION=false

      # Empty disables the link; list-form env keeps quotes as part of the value
      - LEGAL_TERMSANDCONDITIONS=
      - LEGAL_PRIVACYPOLICY=
      - LEGAL_ACCESSIBILITYSTATEMENT=
      - LEGAL_COOKIEPOLICY=
      - LEGAL_IMPRESSUM=
    secrets:
      - oidc_stirling_client_secret
      - global_admin_password
    configs:
      - source: stirling_init
        target: /init.sh
    networks:
      - infra_gw-internal
    volumes:
      - stirling-logs:/logs
      - stirling-configs:/configs
      - stirling-pipeline:/pipeline
      - stirling-tessdata:/usr/share/tessdata
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080$${SYSTEM_ROOTURIPATH:-''}/api/v1/info/status | grep -q 'UP'"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      <<: [*place-main, *deploy]
      update_config:
        order: stop-first
      labels:
        - "traefik.enable=true"
        - "traefik.scope.internal=true"
        - "traefik.http.routers.stirling-pdf.rule=Host(`pdf.${DOMAIN_PRIVATE}`)"
        - "traefik.http.routers.stirling-pdf.entrypoints=websecure"
        - "traefik.http.services.stirling-pdf.loadbalancer.server.port=8080"
        - "homepage.group=no-widget"
        - "homepage.name=Stirling-PDF"
        - "homepage.icon=stirling-pdf"
        - "homepage.href=https://pdf.${DOMAIN_PRIVATE}"
      mode: replicated
      replicas: 1
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M

volumes:
  stirling-logs:
  stirling-configs:
  stirling-pipeline:
  stirling-tessdata:

networks:
  infra_gw-internal:
    external: true

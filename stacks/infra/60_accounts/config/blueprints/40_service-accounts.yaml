# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: Service Accounts
  labels:
    blueprints.goauthentik.io/instantiate: "true"

# Authentik API consumers, each as a role, a service account and an API token

entries:

  # ===== Homepage =====
  # The token value is a pairing secret that Homepage mounts too
  - model: authentik_rbac.role
    id: role-homepage
    state: present
    identifiers:
      name: homepage-role
    attrs:
      permissions:
        - authentik_core.view_user
        - authentik_events.view_event
  - model: authentik_core.user
    id: user-homepage
    state: present
    identifiers:
      username: homepage
    attrs:
      name: homepage
      type: service_account
      roles:
        - !KeyOf role-homepage
  - model: authentik_core.token
    state: present
    identifiers:
      identifier: homepage-token
    attrs:
      intent: api
      user: !KeyOf user-homepage
      expiring: false
      key: !File /run/secrets/widget_authentik_api_key
      description: homepage widget

  # ===== Gatus =====
  # Reads blueprint status so a blueprint that stops applying raises an alert
  - model: authentik_rbac.role
    id: role-gatus
    state: present
    identifiers:
      name: gatus-role
    attrs:
      permissions:
        - authentik_blueprints.view_blueprintinstance
  - model: authentik_core.user
    id: user-gatus
    state: present
    identifiers:
      username: gatus
    attrs:
      name: gatus
      type: service_account
      roles:
        - !KeyOf role-gatus
  - model: authentik_core.token
    state: present
    identifiers:
      identifier: gatus-token
    attrs:
      intent: api
      user: !KeyOf user-gatus
      expiring: false
      key: !File /run/secrets/widget_authentik_gatus_api_key
      description: gatus blueprint check

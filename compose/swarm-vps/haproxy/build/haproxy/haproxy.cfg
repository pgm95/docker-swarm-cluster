# Relay VPS. TCP only: TLS from the public client is never terminated here and
# the public frontend is never in HTTP mode, so this host cannot read what it
# relays. ${VAR} values are expanded by HAProxy from the container environment.

global
    log stdout format raw local0
    maxconn 4096
    user haproxy
    group haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s

defaults
    log global
    mode tcp
    option tcplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    # Governs an established relayed connection. The far end serves streams and
    # websockets lasting hours, so this is the timeout that actually matters.
    timeout tunnel 12h

frontend relay_in
    # Bound to the public interface, not to an address: the socket only accepts
    # packets the kernel attributes to that device (SO_BINDTODEVICE), so the
    # tunnel and loopback never reach it, and the public address itself is
    # infra state this stack never needs to know.
    bind 0.0.0.0:443 interface "${PUBLIC_INTERFACE}"
    default_backend relay_out

backend relay_out
    # Active checks, so clients are refused promptly while a path is down
    # rather than waiting out the connect timeout. Every path carries the real
    # client address to Traefik in a PROXY protocol v2 header. Checks complete
    # a TLS handshake with Traefik through that same PROXY path, so a broken
    # DNAT or a dead entrypoint reads as DOWN, not as failed clients. The data
    # path is plain TCP: the client's own TLS session runs end to end.
    option tcp-check
    default-server inter 5s fall 3 rise 2 send-proxy-v2 check check-ssl verify none check-send-proxy

    # Direct TCP path over the WAN: one backend connection per client
    # connection, so each client is its own TCP flow end to end and the VPS
    # providers' UDP policing never applies. Declared with a placeholder
    # address and disabled: the runtime API can only change an address within
    # the same family, so the placeholder fixes the family to IPv4, and
    # `disabled` keeps checks off it. The endpoint sidecar sets the real
    # address from the WireGuard peer and enables the server. flint DNATs this
    # port from the relay's address to the environment's gateway.
    server home 0.0.0.0:"${HOME_PORT}" disabled

    # WireGuard path, used only while `home` is down. flint DNATs its tunnel
    # address, port 8443, to the same gateway.
    server tunnel "${WG_HOME_ADDR}":8443 backup

# Metrics: the WireGuard interface (scraped from home over the tunnel) and
# loopback (the container healthcheck). Device-bound, so the tunnel listener is
# unreachable from the public interface whatever the firewall says. Nothing
# else is exposed on this host.
frontend metrics
    bind 0.0.0.0:8405 interface "${WG_INTERFACE}"
    bind 127.0.0.1:8405
    mode http
    option httplog
    # Only abnormal requests are logged (denies, errors, timeouts): the
    # container healthcheck and the Prometheus scrape would otherwise drown
    # the relay lines, which are the only per-connection record of which
    # path a client took.
    option dontlog-normal
    http-request return status 200 content-type text/plain string "ok\n" if { path /healthz }
    http-request use-service prometheus-exporter if { path /metrics }
    http-request deny

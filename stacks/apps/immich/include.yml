secrets:
  immich_db_password:
    name: immich_db_password_${DEPLOY_VERSION}
    external: true
  backup_immich_db_password:
    name: backup_immich_db_password_${DEPLOY_VERSION}
    external: true

configs:
  immich_server_init:
    name: immich_server_init_${DEPLOY_VERSION}
    file: ./config/immich-server/init.sh
  immich_init_backup:
    name: immich_init_backup_${DEPLOY_VERSION}
    file: ./config/bootstrap/init-backup.sh

#:schema https://mise.jdx.dev/schema/mise.json

[settings]
experimental = true
auto_install = false
sops.age_key_file = "age.key"

[tools]
"core:python" = "3.14"
"pipx:pytest" = "9.0.2"
"aqua:jdx/usage" = "latest"
"aqua:getsops/sops" = "latest"
"aqua:tamasfe/taplo" = "latest"
"aqua:astral-sh/ruff" = "latest"
"aqua:FiloSottile/age" = "latest"
"aqua:pre-commit/pre-commit" = "latest"

[env]
PROJECT_CONFIGS_DIR = "{{config_root}}/.config"
PROJECT_SECRETS_DIR = "{{config_root}}/.secrets"

PYTHONPATH = "{{config_root}}/.mise/lib"
PYTEST_ADDOPTS = "-c {{ env.PROJECT_CONFIGS_DIR }}/pyproject.toml --rootdir {{config_root}}"
YAMLLINT_CONFIG_FILE = "{{ env.PROJECT_CONFIGS_DIR }}/yamllint.yaml"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
SOPS_CONFIG = "{{ env.PROJECT_CONFIGS_DIR }}/sops.yaml"

SWARM_STACKS_DIR = "{{config_root}}/stacks"
SWARM_ANCHORS_FILE = "{{ env.SWARM_STACKS_DIR }}/_shared/anchors.yml"

GLOBAL_SECRETS = "{{ env.PROJECT_SECRETS_DIR }}/shared.yaml"
_.file = { path = "{{ env.GLOBAL_SECRETS }}", redact = true }

GLOBAL_TZ="UTC"
GLOBAL_TZ_LOCAL="America/Chicago"
GLOBAL_USER_GROUP="app_user"
GLOBAL_ADMIN_GROUP="app_admin"
GLOBAL_NONROOT_PUID="1000"
GLOBAL_NONROOT_PGID="1000"
GLOBAL_NONROOT_DOCKER="{{ env.GLOBAL_NONROOT_PUID }}:{{ env.GLOBAL_NONROOT_PGID }}"

############################ TASKS ############################
[task_config]
shell = "bash -c -o errexit -o nounset -o pipefail"

[tasks."env:setup"]
description = " " # Complete environment setup via mise
run = [
  "mise trust || true",
  "mise install",
  "pre-commit install --config .config/pre-commit.yaml"
]

[tasks."env:clean"]
description = " " # Clean up environment and cache
usage = 'flag "--uninstall" help="Also uninstall all mise tools"'
run = '''
#!/usr/bin/env bash
[[ "${usage_uninstall:-}" == "true" ]] && mise uninstall --all
find . \( -name "*.tmp" -o -name "*.log" -o -name "__pycache__" -o -name "*.pyc" -o -name "*.egg-info" -o -name ".cache" -o -name "*_cache" -o -name ".venv" \) -exec rm -rf {} + || true
'''

[tasks."validate"]
description = " " # Run all pre-commit hooks
run = [
  "pre-commit run --config .config/pre-commit.yaml --all-files"
]

[tasks."status"]
description = " " # Show cluster nodes and health status of all deployed stacks
env.STATUS_SERVICE_WRAP = "2"
run = 'python3 -m swarm.status'

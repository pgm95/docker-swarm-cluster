---
# yaml-language-server: $schema=https://json.schemastore.org/traefik-v3-file-provider.json

http:
  middlewares:
    authentik:
      forwardAuth:
        address: '{{ env "AUTHENTIK_URL" }}'
        authResponseHeaders:
          # Set by the outpost only for providers with basic auth enabled; listed here it is
          # also stripped from client requests on every forward auth router
          - Authorization
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version
